<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <!-- Circle outline -->
  <circle cx="30" cy="30" r="27" fill="none" stroke="#4caf50" stroke-width="3"/>
  <!-- Wheat stalk - vertical line -->
  <line x1="30" y1="12" x2="30" y2="48" stroke="#4caf50" stroke-width="2.2"/>
  <!-- Wheat grains left -->
  <ellipse cx="30" cy="20" rx="5.5" ry="3.2" fill="#4caf50" transform="rotate(-25 30 20)"/>
  <ellipse cx="30" cy="28" rx="5.5" ry="3.2" fill="#4caf50" transform="rotate(-25 30 28)"/>
  <ellipse cx="30" cy="36" rx="5.5" ry="3.2" fill="#4caf50" transform="rotate(-25 30 36)"/>
  <!-- Wheat grains right -->
  <ellipse cx="30" cy="20" rx="5.5" ry="3.2" fill="#4caf50" transform="rotate(25 30 20)"/>
  <ellipse cx="30" cy="28" rx="5.5" ry="3.2" fill="#4caf50" transform="rotate(25 30 28)"/>
  <ellipse cx="30" cy="36" rx="5.5" ry="3.2" fill="#4caf50" transform="rotate(25 30 36)"/>
  <!-- Strike-through line -->
  <line x1="10" y1="50" x2="50" y2="10" stroke="#4caf50" stroke-width="3" stroke-linecap="round"/>
</svg>
