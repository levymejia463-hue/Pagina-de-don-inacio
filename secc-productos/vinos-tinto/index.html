<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Vinos Tintos · Restaurante de Don Inacio — Selección exclusiva de vinos tintos Saint-Émilion Grand Cru de Burdeos.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <title>Vinos Tintos - Restaurante de Don Inacio</title>
</head>

<body>
    <!-- Fondo decorativo -->
    <div class="background-pattern"></div>

    <!-- Navegación superior -->
    <nav class="top-nav">
        <button class="btn-nav btn-back" onclick="window.history.back()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            <span data-i18n="nav-volver">Atrás</span>
        </button>
        <button class="btn-nav btn-home" onclick="window.location.href='../../index.html'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
            <span data-i18n="nav-inicio">Inicio</span>
        </button>

        <div class="nav-right-group">
            <div class="lang-switcher" id="langSwitcher">
                <button class="lang-current" id="langCurrent" aria-haspopup="true" aria-expanded="false">
                    <span class="lang-flag">🇪🇸</span>
                    <span class="lang-code">ES</span>
                    <span class="material-symbols-outlined lang-arrow">expand_more</span>
                </button>
                <div class="lang-dropdown" id="langDropdown">
                    <button class="lang-option active" data-lang="es"><span class="lang-flag">🇪🇸</span>
                        Español</button>
                    <button class="lang-option" data-lang="pt"><span class="lang-flag">🇵🇹</span> Português</button>
                    <button class="lang-option" data-lang="en"><span class="lang-flag">🇺🇸</span> English</button>
                </div>
            </div>
            <a href="../../reservas/index.html" class="nav-reservar" data-i18n="nav-reservar">Reservar Mesa</a>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="hero-content">
            <div class="hero-badge" data-i18n="hero-badge">SAINT-ÉMILION · BURDEOS</div>
            <div class="hero-decorative-line"></div>
            <h1 class="hero-title">
                <span class="title-vinos" data-i18n="hero-title">VINOS TINTOS</span>
            </h1>
            <div class="hero-decorative-line"></div>
            <p class="hero-subtitle" data-i18n="hero-desc">Elegancia bordelesa en su máxima expresión · Chateau Champion
                Grand Cru</p>
        </div>
        <div class="hero-grape-illustration">
            <svg viewBox="0 0 200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="100" cy="60" r="18" fill="currentColor" opacity="0.25" />
                <circle cx="75" cy="90" r="18" fill="currentColor" opacity="0.25" />
                <circle cx="125" cy="90" r="18" fill="currentColor" opacity="0.25" />
                <circle cx="60" cy="120" r="18" fill="currentColor" opacity="0.2" />
                <circle cx="100" cy="116" r="18" fill="currentColor" opacity="0.2" />
                <circle cx="140" cy="120" r="18" fill="currentColor" opacity="0.2" />
                <circle cx="80" cy="148" r="18" fill="currentColor" opacity="0.15" />
                <circle cx="120" cy="148" r="18" fill="currentColor" opacity="0.15" />
                <circle cx="100" cy="175" r="18" fill="currentColor" opacity="0.1" />
                <line x1="100" y1="40" x2="100" y2="15" stroke="currentColor" stroke-width="2" opacity="0.3" />
                <path d="M100 15 Q115 5 125 15" stroke="currentColor" stroke-width="1.5" fill="none" opacity="0.3" />
            </svg>
        </div>
    </section>

    <!-- Comparativa de añadas -->
    <section class="vintage-ribbon">
        <div class="vintage-ribbon-inner">
            <div class="vintage-tag" data-i18n="ribbon-appellation">🍷 A.O.C. Saint-Émilion Grand Cru · Burdeos, Francia</div>
            <div class="vintage-sep">·</div>
            <div class="vintage-tag" data-i18n="ribbon-cepas">🌿 Cabernet Sauvignon · Cabernet Franc · Merlot</div>
        </div>
    </section>

    <!-- Lista de productos -->
    <main class="products-main">
        <div class="products-grid" id="productosLista">
            <!-- Los productos se cargarán aquí dinámicamente -->
        </div>
    </main>

    <!-- Footer decorativo -->
    <footer class="wine-footer">
        <div class="footer-vine-pattern"></div>
        <p class="footer-text">Restaurante de Don Inacio © 2026</p>
    </footer>

    <!-- Modal de producto detallado -->
    <div id="productoModal" class="modal">
        <div class="modal-overlay" onclick="cerrarModal()"></div>
        <div class="modal-content">
            <button class="modal-close" onclick="cerrarModal()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <div class="modal-body">
                <div class="modal-image-container">
                    <img id="modalImagen" src="" alt="" class="modal-image">
                </div>
                <div class="modal-info">
                    <div class="modal-appellation" data-i18n="modal-appellation">A.O.C. Saint-Émilion Grand Cru</div>
                    <h2 id="modalNombre" class="modal-nombre"></h2>

                    <p id="modalDescripcion" class="modal-descripcion"></p>
                    <p id="modalPrecio" class="modal-precio"></p>
                    <button id="modalWhatsapp" class="btn-whatsapp-modal">
                        📱 Pedir por WhatsApp
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
