<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=menu" />
    <link rel="stylesheet" href="style1.css">
    <title>GALERÍA - Restaurante de Don Inacio</title>
</head>
<body>

    <div class="sub-header" id="sub-header">
        <div class="logo">
            <h1 onclick="volver()">Restaurante de <br><span style="font-size: 1.1rem;">don inacio</span></h1>
        </div>

        <button class="br btns-menu">ver menu</button>
        <button class="br btns-reservar" onclick="window.location.href='../reservas/index.html'">reservar</button>
        
        <div class="menu-ham" id="manuham">
            <button class="btn-close" id="close"> X </button>
            <nav>
                <ul>
                    <li><a href="/index.html">Inicio</a></li>
                    <li><a href="/galeria-de-fotos/index1.html">Galeria</a></li>
                    <li><a href="/Menu/index3.html">Menú</a></li>
                    <li><a href="/secc-productos/index2.html">Productos</a></li>
                    <li><a href="/reservas/index.html">Reservar</a></li>
                </ul>
            </nav>
        </div>
        <button class="openMenu" id="openMenu"><span class="material-symbols-outlined">menu</span></button>
    </div>

    <!-- Título de la galería -->
    <div class="gallery-header">
        <h2>Nuestra Galería</h2>
        <p>Descubre los momentos más especiales de nuestro restaurante</p>
    </div>

    <!-- Filtros opcionales -->
    <div class="gallery-filters">
        <button class="filter-btn active" data-filter="all">Todas</button>
        <button class="filter-btn" data-filter="food">Comida</button>
        <button class="filter-btn" data-filter="ambiente">Ambiente</button>
        <button class="filter-btn" data-filter="eventos">Eventos</button>
    </div>

    <!-- Galería responsive con grid -->
    <div class="gallery-container">
        <div class="gallery-grid" id="galleryGrid">
            <!-- Las imágenes se cargarán desde el JavaScript -->
        </div>
    </div>

    <!-- Modal para lightbox -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightboxClose">
            <span class="material-symbols-outlined">x</span>
        </button>
        
        <button class="lightbox-nav lightbox-prev" id="lightboxPrev">
            <span class="material-symbols-outlined"><</span>
        </button>
        
        <div class="lightbox-content">
            <img src="" alt="" id="lightboxImg">
            <div class="lightbox-counter" id="lightboxCounter"></div>
        </div>
        
        <button class="lightbox-nav lightbox-next" id="lightboxNext">
            <span class="material-symbols-outlined">></span>
        </button>
    </div>

    <!-- Loading spinner -->
    <div class="loading-spinner" id="loadingSpinner">
        <div class="spinner"></div>
    </div>

    <script src="script1.js"></script>
</body>
</html>
