<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=menu" />
    <title>Manteca Natural - Restaurante de Don Inacio</title>
</head>
<body>

    <!--Contenido principal-->
    <div class="main-container">
        <div class="category-header">
            <div class="navigation-buttons">
                <button class="btn-back" onclick="window.history.back()">
                    <span class="arrow">←</span> Atrás
                </button>
                <button class="btn-home" onclick="window.location.href='../../index.html'">
                    <span class="home-icon">🏠</span> Inicio
                </button>
            </div>
            <h1 class="category-name">Manteca Natural</h1>
            <p class="category-description">Descubre nuestra manteca artesanal 100% natural de cerdo, elaborada siguiendo la auténtica receta tradicional portuguesa. Un producto gourmet sin aditivos, conservantes ni colorantes, perfecto para dar sabor auténtico y tradicional a tus recetas favoritas.</p>
        </div>

        <!--Modal de detalles del producto-->
        <div class="detalles" id="detallesDelProducto">
            <button class="btn-close" onclick="cerrarDetalles()">×</button>
        </div>

        <!--Overlay-->
        <div class="overlay" id="overlay"></div>

        <!--Secciones de productos por categoría-->
        <div class="secciones-container" id="seccionesContainer">
            <!-- Los productos se cargarán aquí dinámicamente -->
        </div>
    </div>

    <script src="manteca.js"></script>
</body>
</html>
